version: "3.9"

services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./main/infra/db/init:/docker-entrypoint-initdb.d
    networks:
      - backend

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: server1
    depends_on:
      - db
    ports:
      - "8080:8080"
    networks:
      - backend
    environment:
      - DB_HOST=db
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
    working_dir: /server
    command: ./server         # 作成されたバイナリを起動
    # ↓ 開発中のみホストのソースをマウントしてホットリロード可能
    # volumes:
    #   - .:/server

volumes:
  pgdata:

networks:
  backend:
    driver: bridge
